<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>X Bookmarks Organizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#bookmarks">Skip to bookmarks</a>

    <header class="app-header">
      <button
        id="sidebar-toggle"
        class="icon-btn sidebar-toggle"
        type="button"
        aria-controls="sidebar"
        aria-expanded="true"
        aria-label="Hide categories"
      >
        <span class="icon-bars" aria-hidden="true"></span>
      </button>
      <div class="app-heading">
        <h1 class="app-title">X Bookmarks</h1>
        <p class="app-subtitle">Browse your bookmarks by topic. Opening one marks it read.</p>
      </div>
    </header>

    <div class="app-body">
      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

      <nav id="sidebar" class="sidebar" aria-label="Category tree">
        <div class="sidebar-inner">
          <div class="sidebar-topbar">
            <h2 class="sidebar-heading">Categories</h2>
            <button
              id="sidebar-close"
              class="icon-btn sidebar-close"
              type="button"
              aria-label="Close categories"
            >
              <span class="icon-x" aria-hidden="true"></span>
            </button>
          </div>
          <div id="tree" class="tree">
            <p class="state state-loading" role="status">Loading categories…</p>
          </div>
        </div>
      </nav>

      <main id="bookmarks" class="content" aria-label="Bookmarks" tabindex="-1">
        <div class="content-inner">
          <div class="content-header">
            <h2 id="content-title" class="content-title">Select a category</h2>
            <p id="content-count" class="content-count" aria-live="polite"></p>
          </div>
          <div id="bookmark-list" class="bookmark-list" aria-live="polite">
            <div class="state state-empty state-welcome">
              <span class="state-icon" aria-hidden="true">🔖</span>
              <p class="state-title">Nothing selected yet</p>
              <p class="state-body">Choose a category from the sidebar to see its bookmarks.</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://platform.twitter.com/widgets.js" async></script>
    <script src="app.js" defer></script>
  </body>
</html>
