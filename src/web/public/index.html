<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>X Bookmarks Organizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#bookmarks">Skip to bookmarks</a>

    <header class="topbar">
      <div class="topbar-left">
        <button
          id="sidebar-toggle"
          class="icon-btn menu-toggle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="true"
          aria-label="Hide categories"
        >
          <span class="icon-menu" aria-hidden="true">
            <span class="menu-bar"></span>
            <span class="menu-bar"></span>
            <span class="menu-bar"></span>
          </span>
        </button>
        <p id="sync-status" class="sync-status" aria-live="polite" hidden>
          <span id="sync-status-date" class="sync-status-date"></span>
          <span id="sync-status-rel" class="sync-status-rel"></span>
        </p>
      </div>

      <div class="topbar-center">
        <h1 id="content-title" class="topbar-title">Select a category</h1>
        <span id="content-count" class="topbar-count" aria-live="polite"></span>
      </div>

      <div class="topbar-right">
        <div
          id="read-filter"
          class="segmented"
          role="radiogroup"
          aria-label="Filter bookmarks by read state"
          hidden
        >
          <label class="seg">
            <input class="seg-input" type="radio" name="read-filter" value="unread" />
            <span class="seg-label">Unread</span>
          </label>
          <label class="seg">
            <input class="seg-input" type="radio" name="read-filter" value="read" />
            <span class="seg-label">Read</span>
          </label>
          <label class="seg">
            <input class="seg-input" type="radio" name="read-filter" value="all" checked />
            <span class="seg-label">All</span>
          </label>
        </div>

        <button
          id="search-open"
          class="icon-btn"
          type="button"
          aria-controls="category-search"
          aria-label="Search categories"
        >
          <svg class="icon-glyph" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2" />
            <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>

        <button
          id="color-toggle"
          class="icon-btn is-toggle quick-only"
          type="button"
          aria-pressed="false"
          aria-label="Turn category colors on"
        >
          <svg class="icon-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 3a9 9 0 0 0 0 18 2 2 0 0 0 2-2 1.9 1.9 0 0 0-.5-1.3 1.9 1.9 0 0 1-.5-1.3 2 2 0 0 1 2-2H17a4 4 0 0 0 4-4c0-3.9-4-7.4-9-7.4z"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <circle cx="7.5" cy="11.5" r="1.3" fill="currentColor" />
            <circle cx="11" cy="8" r="1.3" fill="currentColor" />
            <circle cx="15.5" cy="9.5" r="1.3" fill="currentColor" />
            <circle cx="7.5" cy="16" r="1.3" fill="currentColor" />
          </svg>
        </button>

        <button
          id="theme-toggle"
          class="icon-btn theme-toggle quick-only"
          type="button"
          aria-pressed="false"
          aria-label="Switch to dark theme"
        >
          <svg class="icon-sun icon-glyph" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
            <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <line x1="10" y1="1.5" x2="10" y2="3.5" />
              <line x1="10" y1="16.5" x2="10" y2="18.5" />
              <line x1="1.5" y1="10" x2="3.5" y2="10" />
              <line x1="16.5" y1="10" x2="18.5" y2="10" />
              <line x1="4.2" y1="4.2" x2="5.6" y2="5.6" />
              <line x1="14.4" y1="14.4" x2="15.8" y2="15.8" />
              <line x1="4.2" y1="15.8" x2="5.6" y2="14.4" />
              <line x1="14.4" y1="5.6" x2="15.8" y2="4.2" />
            </g>
          </svg>
          <svg class="icon-moon icon-glyph" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path
              d="M15.5 12.3A6.5 6.5 0 0 1 7.7 4.5a6.5 6.5 0 1 0 7.8 7.8z"
              fill="currentColor"
            />
          </svg>
        </button>

        <div class="settings-anchor">
          <button
            id="settings-toggle"
            class="icon-btn settings-toggle"
            type="button"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="settings-panel"
            aria-label="Open settings"
          >
            <svg
              class="icon-glyph"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>

          <div
            id="settings-panel"
            class="settings-panel"
            role="dialog"
            aria-labelledby="settings-panel-title"
            hidden
          >
            <h2 id="settings-panel-title" class="settings-panel-title">Settings</h2>

            <div class="settings-group">
              <span class="settings-label" id="post-scale-label">Post size</span>
              <div
                id="post-scale"
                class="segmented settings-segmented"
                role="radiogroup"
                aria-labelledby="post-scale-label"
              >
                <label class="seg">
                  <input class="seg-input" type="radio" name="post-scale" value="small" />
                  <span class="seg-label">Small</span>
                </label>
                <label class="seg">
                  <input class="seg-input" type="radio" name="post-scale" value="medium" checked />
                  <span class="seg-label">Medium</span>
                </label>
                <label class="seg">
                  <input class="seg-input" type="radio" name="post-scale" value="large" />
                  <span class="seg-label">Large</span>
                </label>
              </div>
              <p class="settings-hint">Resizes the post cards, embedded X post included.</p>
            </div>

            <div class="settings-group">
              <span class="settings-label">Appearance</span>
              <button
                id="theme-switch"
                class="switch-row"
                type="button"
                role="switch"
                aria-checked="false"
              >
                <span class="switch-row-label">Dark theme</span>
                <span class="switch-track" aria-hidden="true">
                  <span class="switch-thumb"></span>
                </span>
              </button>
              <button
                id="category-color-toggle"
                class="switch-row"
                type="button"
                role="switch"
                aria-checked="false"
              >
                <span class="switch-row-label">Category colors</span>
                <span class="switch-track" aria-hidden="true">
                  <span class="switch-thumb"></span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="app-body">
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <nav id="sidebar" class="sidebar" aria-label="Category tree">
        <div class="sidebar-inner">
          <div class="sidebar-topbar">
            <h2 class="sidebar-heading">Categories</h2>
          </div>
          <div class="sidebar-search">
            <label class="visually-hidden" for="category-search">Filter categories by name</label>
            <div class="search-field">
              <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2" />
                <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              <input
                id="category-search"
                class="search-input"
                type="search"
                placeholder="Filter categories…"
                autocomplete="off"
                spellcheck="false"
                aria-controls="tree"
              />
              <button
                id="category-search-clear"
                class="search-clear"
                type="button"
                aria-label="Clear category filter"
                hidden
              >
                <span class="icon-x" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div id="tree" class="tree">
            <p class="state state-loading" role="status">Loading categories…</p>
          </div>
        </div>
      </nav>

      <main id="bookmarks" class="content" aria-label="Bookmarks" tabindex="-1">
        <div class="content-inner">
          <div id="bookmark-list" class="bookmark-list" aria-live="polite">
            <div class="state state-empty state-welcome">
              <span class="state-icon" aria-hidden="true">🔖</span>
              <p class="state-title">Nothing selected yet</p>
              <p class="state-body">Choose a category from the sidebar to see its bookmarks.</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

    <div id="summary-backdrop" class="reader-backdrop" hidden></div>
    <div
      id="summary-modal"
      class="reader-modal summary-modal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="summary-title"
    >
      <div class="reader-panel summary-panel">
        <div class="reader-header">
          <div class="reader-heading">
            <h2 id="summary-title" class="reader-title">Summary</h2>
            <p id="summary-meta" class="reader-meta" hidden></p>
          </div>
          <div class="reader-header-actions">
            <button id="summary-close" class="icon-btn reader-close" type="button" aria-label="Close summary">
              <span class="icon-x" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div id="summary-body" class="reader-body"></div>
      </div>
    </div>

    <script src="https://platform.twitter.com/widgets.js" async></script>
    <script src="vendor/marked.min.js" defer></script>
    <script src="vendor/dompurify.min.js" defer></script>
    <script src="render-markdown.js" defer></script>
    <script src="theme.js" defer></script>
    <script src="post-scale.js" defer></script>
    <script src="sidebar-state.js" defer></script>
    <script src="tree-color.js" defer></script>
    <script src="tree-counts.js" defer></script>
    <script src="read-toggle.js" defer></script>
    <script src="filter-cache.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
