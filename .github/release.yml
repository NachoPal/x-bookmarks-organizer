# Configures the auto-generated release notes produced by
# `gh release create --generate-notes` (see .github/workflows/release.yml).
#
# GitHub's `categories` and `exclude` match on PR **labels** and **authors**,
# not title prefixes. `documentation` is applied automatically by
# .github/labeler.yml; apply `enhancement` / `bug` by hand, and
# `ignore-for-release` on PRs that should not appear in the notes. A PR with
# none of them falls into the catch-all "Other changes".
# Schema: https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions
      - github-actions[bot]
  categories:
    - title: "🚀 Features"
      labels:
        - enhancement
    - title: "🐛 Fixes"
      labels:
        - bug
    - title: "📖 Documentation"
      labels:
        - documentation
    - title: "Other changes"
      labels:
        - "*"
